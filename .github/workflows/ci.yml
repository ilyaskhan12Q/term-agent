name: CI

on:
  push:
    branches: [ main, "feat/*", "fix/*", "refactor/*", "security/*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    name: Build & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Check Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Run Unit & Integration Tests
        run: go test -v ./...

      - name: Concurrency & Data Race Inspection
        run: go test -race -v ./...

      - name: Build Binary
        run: go build ./...
